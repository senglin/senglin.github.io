# site settings
title: Seng Lin Shee, PhD
subtitle: in Mountain View, CA
email: signup.github@kgkoo.com
description: A personal website showcasing my projects and blog posts.
baseurl:  # the subpath of your site, e.g. /blog
url: https://senglin.github.io # the base hostname & protocol for your site
author: Seng Lin Shee
street_address: 
city: 
state: 
zip_code: 
country: 
phone: 

# homepage tiles
tiles-source: pages # accepts "posts" or "pages"
